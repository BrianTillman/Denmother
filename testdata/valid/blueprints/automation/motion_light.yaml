blueprint:
  name: Motion-activated Light
  description: Turn on a light when motion is detected
  domain: automation
  input:
    motion_entity:
      name: Motion Sensor
      selector:
        entity:
          domain: binary_sensor
          device_class: motion
    light_target:
      name: Light
      selector:
        target:
          entity:
            domain: light

trigger:
  - platform: state
    entity_id: !input motion_entity
    to: "on"

action:
  - service: light.turn_on
    target: !input light_target
