name: Denmother
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan source and history for secrets
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.24.3 dir . --redact
          go run github.com/zricethezav/gitleaks/v8@v8.24.3 git . --redact --log-opts="--all"
      - name: Install runtime preparation test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/denmother-python"
          "$RUNNER_TEMP/denmother-python/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/denmother-python/bin" >> "$GITHUB_PATH"
      - run: python3 -B scripts/acceptance.py source
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run --no-config --enable-only=govet,staticcheck,unused ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: ./dm release build --version 0.1.0-rc.1 --homebrew-repository "$RELEASE_REPOSITORY" --json
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/
          retention-days: 7
          if-no-files-found: error
  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start the contributor devcontainer
        id: devcontainer
        run: npx --yes @devcontainers/cli@0.89.0 up --workspace-folder . --frozen-lockfile
      - name: Run the full contributor preflight
        run: npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . bash .devcontainer/smoke.sh --with-deps
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devcontainer-preflight
          path: artifacts/preflight/
          if-no-files-found: error
          retention-days: 7
  homebrew:
    needs: source
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist/
      - name: Install and test the generated formula against local release archives
        run: python3 -B scripts/acceptance.py homebrew --native
  runtime-matrix:
    runs-on: ubuntu-latest
    outputs:
      ha: ${{ steps.versions.outputs.ha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: versions
        run: echo "ha=$(python3 scripts/acceptance.py matrix)" >> "$GITHUB_OUTPUT"
  runtime-tests:
    needs: runtime-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ha: ${{ fromJSON(needs.runtime-matrix.outputs.ha) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o dm .
      - name: Install browser and run required Chromium regressions
        run: python3 -B scripts/acceptance.py browser --with-deps
      - name: Run isolated runtime acceptance
        env:
          HA_VERSION: ${{ matrix.ha }}
        run: python3 -B scripts/acceptance.py runtime --ha "$HA_VERSION"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-acceptance-${{ matrix.ha }}
          path: artifacts/preflight/
          if-no-files-found: error
          retention-days: 7
  platform-tests:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist/
      - name: Verify checksum and exercise the native release archive
        shell: bash
        run: python scripts/platform-acceptance.py --archive-dir dist --directory "$RUNNER_TEMP/denmother-platform"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-${{ matrix.os }}
          path: ${{ runner.temp }}/denmother-platform/acceptance.json
          if-no-files-found: error
  runtime:
    needs: runtime-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Home Assistant version
        env:
          RESULT: ${{ needs.runtime-tests.result }}
        run: test "$RESULT" = success
  platform:
    needs: platform-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every native platform
        env:
          RESULT: ${{ needs.platform-tests.result }}
        run: test "$RESULT" = success
