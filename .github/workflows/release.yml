name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
      - name: Install runtime preparation test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/denmother-python"
          "$RUNNER_TEMP/denmother-python/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/denmother-python/bin" >> "$GITHUB_PATH"
      - run: go run github.com/zricethezav/gitleaks/v8@v8.24.3 dir . --redact
      - run: go run github.com/zricethezav/gitleaks/v8@v8.24.3 git . --redact --log-opts="--all"
      - run: python3 -B scripts/acceptance.py source
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Install browser and run required Chromium regressions
        run: python3 -B scripts/acceptance.py browser --with-deps
      - name: Run the complete isolated HA matrix
        run: python3 -B scripts/acceptance.py runtime
      - name: Package release and skill
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./dm release build --version "${RELEASE_TAG#v}" --homebrew-repository "$RELEASE_REPOSITORY" --json
      - name: Verify installation outside the checkout
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export HOME="$RUNNER_TEMP/dm-install-home"
          export CODEX_HOME="$HOME/.codex"
          export CLAUDE_CONFIG_DIR="$HOME/.claude"
          export PATH="$RUNNER_TEMP/dm-bin:$PATH"
          ./setup --version "${RELEASE_TAG#v}" --archive-dir dist --bin-dir "$RUNNER_TEMP/dm-bin" --harness codex,claude --offline --json
          dm skills status --harness codex,claude --json
          "$RUNNER_TEMP/dm-bin/dm" init --directory "$RUNNER_TEMP/dm-example" --agent --skill --json
          "$RUNNER_TEMP/dm-bin/dm" --config "$RUNNER_TEMP/dm-example/ha-config" --no-schema --json
      - name: Publish matching archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "Denmother ${RELEASE_TAG#v}" --generate-notes "${flags[@]}" dist/*.tar.gz dist/SHA256SUMS dist/homebrew/Formula/denmother.rb
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dashboard-evidence
          path: |
            artifacts/preflight/
          if-no-files-found: ignore
